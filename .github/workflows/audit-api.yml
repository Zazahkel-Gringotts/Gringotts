name: Audit des données de jeu

on:
  workflow_dispatch:
  push:
    paths:
      - tools/audit_api.py
      - .github/workflows/audit-api.yml

permissions:
  contents: write

concurrency:
  group: audit-api
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit API Blizzard
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python tools/audit_api.py
      - name: Publier
        run: |
          git config user.name "gringotts-bot"
          git config user.email "gringotts-bot@users.noreply.github.com"
          git add data/audit
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "audit API $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i*5))
          done
          echo "Échec de la publication" >&2; exit 1
